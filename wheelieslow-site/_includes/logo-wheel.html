{%- comment -%}
Full WS wheel logo. Pass size, e.g. {% include logo-wheel.html size="260" %}
{%- endcomment -%}
<svg class="logo-wheel" width="{{ include.size | default: 260 }}" height="{{ include.size | default: 260 }}" viewBox="0 0 300 300" role="img" aria-label="Wheelieslow logo">
  <g stroke="var(--ink)" stroke-width="1.6" opacity="0.55">
    <line x1="30" y1="150" x2="270" y2="150"/>
    <line x1="46.1" y1="90" x2="253.9" y2="210"/>
    <line x1="90" y1="46.1" x2="210" y2="253.9"/>
    <line x1="150" y1="30" x2="150" y2="270"/>
    <line x1="210" y1="46.1" x2="90" y2="253.9"/>
    <line x1="253.9" y1="90" x2="46.1" y2="210"/>
  </g>
  <circle cx="150" cy="150" r="120" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <circle cx="150" cy="150" r="133" fill="none" stroke="var(--ink)" stroke-width="16"/>
  <circle cx="150" cy="150" r="133" fill="none" stroke="var(--accent)" stroke-width="16" stroke-dasharray="60 776" stroke-dashoffset="-250" stroke-linecap="round"/>
  <text x="150" y="184" text-anchor="middle" fill="var(--ink)" font-family="Archivo, sans-serif" font-weight="800" font-style="italic" font-size="108" letter-spacing="-6" stroke="var(--ground)" stroke-width="8" paint-order="stroke">WS</text>
</svg>
