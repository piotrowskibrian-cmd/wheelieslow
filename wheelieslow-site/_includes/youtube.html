{%- comment -%}
YouTube video embed. Usage inside a post:
  {% include youtube.html id="dQw4w9WgXcQ" %}
The id is the part after watch?v= (or after youtu.be/) in the video link.
{%- endcomment -%}
<div class="video">
  <iframe src="https://www.youtube-nocookie.com/embed/{{ include.id }}" title="{{ include.title | default: 'YouTube video' }}" loading="lazy" allow="accelerometer; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
</div>
