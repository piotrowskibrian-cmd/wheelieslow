<ul class="post-list">
  {%- for post in include.posts -%}
  <li>
    <a class="post-card" href="{{ post.url | relative_url }}">
      {% if post.image %}<img class="post-card-img" src="{{ post.image | relative_url }}" alt="" loading="lazy">{% endif %}
      <span class="eyebrow">
        <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%b %-d, %Y" }}</time>
        {% if post.category %}<span class="dot" aria-hidden="true">·</span>{{ post.category }}{% endif %}
      </span>
      <span class="post-card-title">{{ post.title }}</span>
      <span class="post-card-summary">{{ post.summary | default: post.excerpt | strip_html | truncatewords: 32 }}</span>
    </a>
  </li>
  {%- endfor -%}
</ul>
