name: Update Garmin stats

# Runs once a day (about 6:20 AM Central) and can also be run by hand from
# the Actions tab: Update Garmin stats -> Run workflow.
on:
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_stats.py
      - .github/workflows/garmin-stats.yml

permissions:
  contents: write
  pages: write

concurrency:
  group: garmin-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pull totals from Garmin
        env:
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
        run: python3 scripts/update_stats.py

      - name: Save if anything changed
        id: save
        run: |
          if git diff --quiet -- _data/stats.json && [ -z "$(git ls-files --others --exclude-standard _data/stats.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/stats.json
          git commit -m "Update Garmin stats"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Rebuild the site
        if: steps.save.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent
