name: Update Garmin stats

# Runs four times a day (roughly 5 AM, 11 AM, 5 PM and 10 PM Central; GitHub
# often starts scheduled jobs late) and can also be run by hand from the
# Actions tab: Update Garmin stats -> Run workflow. It also runs whenever this
# file or scripts/update_stats.py changes.
on:
  schedule:
    - cron: "23 11,17,23 * * *"
    - cron: "23 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_stats.py
      - .github/workflows/garmin-stats.yml

permissions:
  contents: write

concurrency:
  group: garmin-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Pull totals from Garmin
        env:
          GARMIN_API_KEY: ${{ secrets.GARMIN_API_KEY }}
        run: python3 scripts/update_stats.py

      - name: Save if anything changed
        id: save
        run: |
          if git diff --quiet -- _data/stats.json && [ -z "$(git ls-files --others --exclude-standard _data/stats.json)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/stats.json
          git commit -m "Update Garmin stats"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
