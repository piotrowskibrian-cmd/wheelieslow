# ---------------------------------------------------------------
# Wheelieslow site settings
# Edit the values in this block. After saving, GitHub rebuilds the
# site automatically in a minute or two.
# ---------------------------------------------------------------
title: Wheelieslow
description: >-
  A former Cat 1 mountain biker and Cat 2 cyclocross racer riding, skiing
  and climbing his way back from a run of injuries, one season at a time.
author: Brian Piotrowski
url: "https://wheelieslow.com"
baseurl: ""

# Social links. Leave a value empty ("") to hide that link.
youtube: "https://www.youtube.com/@wheelieslow"
instagram: "https://www.instagram.com/wheelieslow"
strava: "https://www.strava.com/athletes/736237"

# Photos. Upload an image to assets/img/ and put its path here, e.g.
# "/assets/img/home.jpg". It replaces the big WS wheel on that page.
# Leave empty to keep the wheel.
home_photo: ""
home_photo_alt: ""
about_photo: ""
about_photo_alt: ""

# Email signup. When you set up a free newsletter (Buttondown, Kit, etc.),
# paste its public signup page link here and a "Get updates by email"
# button appears on the site. Leave empty to hide it.
newsletter_url: ""

# Keeps Google and other search engines from listing the site while it's
# still being worked on. Change to false when you're ready to launch.
hide_from_search: true

# ---------------------------------------------------------------
# You normally don't need to change anything below this line.
# ---------------------------------------------------------------
timezone: America/Chicago
permalink: /journal/:year/:title/
markdown: kramdown
kramdown:
  input: GFM
plugins:
  - jekyll-feed
  - jekyll-seo-tag
feed:
  path: feed.xml
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - scripts
